# Docker Compose - E2E Testing Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build e2e

services:
  e2e:
    build:
      context: .
      dockerfile: be/e2e/Dockerfile
    image: niyati/e2e:latest
    container_name: niyati-e2e
    environment:
      BFF_BASE: ${BFF_BASE:-http://bff-platform:3000/api/v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
      NODE_ENV: test
    depends_on:
      - postgres
      - bff-auth
      - bff-platform
      - redis
      - mailhog
    networks:
      - niyati
