# CI Docker Compose Overlay
# =============================================================================
# Use with: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# This overlay:
# - Uses different ports to avoid conflicts with dev/production
# - Runs mock-n8n instead of real n8n
# - Builds UI in production mode for static file serving
# - Exposes Postgres for test data seeding
# =============================================================================

services:
  # Mock N8N for CI (avoids dependency on real n8n)
  n8n:
    image: node:20-alpine
    volumes:
      - ../scripts/mock-n8n.js:/app/mock-n8n.js:ro
    command: node /app/mock-n8n.js
    expose:
      - "5678"
    ports:
      - "${N8N_PORT:-6678}:5678"
    networks:
      - niyati
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    ports:
      - "${POSTGRES_PORT:-56432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-7379}:6379"

  bff-platform:
    ports:
      - "${BFF_PLATFORM_PORT:-4000}:${BFF_PLATFORM_PORT:-4000}"
    environment:
      PORT: ${BFF_PLATFORM_PORT:-4000}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-ci-test-token}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/chat

  bff-auth:
    ports:
      - "${BFF_AUTH_PORT:-4001}:${BFF_AUTH_PORT:-4001}"
    environment:
      PORT: ${BFF_AUTH_PORT:-4001}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-ci-test-token}
      BFF_PLATFORM_BASE: http://bff-platform:${BFF_PLATFORM_PORT:-4000}/api/v1

  ui-service:
    build:
      context: ../apps/ui
      dockerfile: Dockerfile
      target: production
      args:
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:-/webhook/chat}
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-}
        VITE_DEBUG_MODE: ${VITE_DEBUG_MODE:-true}

  caddy:
    ports:
      - "${CADDY_HTTP_PORT:-6173}:5173"
    environment:
      BFF_PLATFORM_PORT: ${BFF_PLATFORM_PORT:-4000}
      BFF_AUTH_PORT: ${BFF_AUTH_PORT:-4001}
    depends_on:
      - ui-service
      - bff-platform
      - bff-auth
      - n8n

networks:
  niyati:
    external: false
