# Docker Compose - Production Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file extends the base configuration with:
#   - Environment variables for sensitive credentials (instead of Docker secrets)
#   - Production-optimized settings
#   - Additional services (migration, backup, proxy)
#   - Explicit container naming for management

# =============================================================================
# YAML ANCHORS FOR PRODUCTION (DRY Configuration)
# =============================================================================

# Shared production environment settings
x-prod-env: &prod-env
  NODE_ENV: production
  LOG_PRETTY_PRINT: "false"
  LOG_LEVEL: info

services:
  postgres:
    container_name: niyati-postgres-prod
    image: postgres:15-alpine
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyati_prod}
      # Unset POSTGRES_PASSWORD from base compose - use only _FILE variant with secrets
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-niyati_prod}
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "1GB"
      POSTGRES_EFFECTIVE_CACHE: "3GB"
    restart: always

  redis:
    container_name: niyati-redis-prod
    image: redis:7-alpine
    volumes:
      - redis-data-prod:/data
    restart: always

  bff-auth:
    build:
      target: production
    image: niyati/bff-auth:production
    container_name: niyati-bff-auth-prod
    ports: []
    expose:
      - "${BFF_AUTH_PORT:-3001}"
    secrets:
      - postgres_password
      - jwt_secret
      - access_token_secret
    environment:
      <<: *prod-env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ACCESS_TOKEN_SECRET_FILE: /run/secrets/access_token_secret
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      CORS_ALLOWED: ${CORS_ALLOWED}
      ALLOW_CROSS_SITE_COOKIES: ${ALLOW_CROSS_SITE_COOKIES:-false}
    restart: always

  bff-platform:
    build:
      target: production
    image: niyati/bff-platform:production
    container_name: niyati-bff-platform-prod
    ports: []
    expose:
      - "${BFF_PLATFORM_PORT:-3000}"
    secrets:
      - postgres_password
    environment:
      <<: *prod-env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CORS_ALLOWED: ${CORS_ALLOWED}
      ALLOW_CROSS_SITE_COOKIES: ${ALLOW_CROSS_SITE_COOKIES:-false}
    restart: always

  ui-service:
    build:
      target: production
    image: niyati/ui:production
    container_name: niyati-ui-prod
    ports: []
    expose:
      - "${UI_PROD_PORT:-80}"
    environment:
      <<: *prod-env
    restart: always

  worker:
    container_name: niyati-worker-prod
    secrets:
      - worker_token
    environment:
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      WORKER_TOKEN_FILE: /run/secrets/worker_token
    restart: always
    profiles: []  # Enable in production (override base profile)

  # Migration runner (one-shot)
  migrate:
    image: postgres:15-alpine
    container_name: niyati-migrate-prod
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-niyati_prod}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB:-niyati_prod}
      - PGHOST=postgres
      - PGPORT=5432
    networks:
      - niyati
    volumes:
      - ../packages/migrations:/migrations:ro
      - ../scripts/run_migrations.js:/scripts/run_migrations.js:ro
    command: ["node", "/scripts/run_migrations.js"]
    profiles:
      - migration


  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: niyati-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data-prod:/data
      - caddy-config-prod:/config
    networks:
      - niyati
    depends_on:
      - ui-service
      - bff-auth
      - bff-platform
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data-prod:
    driver: local
  redis-data-prod:
    driver: local
  caddy-data-prod:
    driver: local
  caddy-config-prod:
    driver: local

# =============================================================================
# DOCKER SECRETS - Production credential management
# =============================================================================
# Secrets are read from files in the secrets/ directory (gitignored)
# Services access them via /run/secrets/<secret_name> inside containers
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_secret:
    file: ./secrets/jwt_secret
  access_token_secret:
    file: ./secrets/access_token_secret
  worker_token:
    file: ./secrets/worker_token
  service_token:
    file: ./secrets/service_token
