name: UI Bundle Size Check

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      per_file_limit:
        description: 'Per-file gzip limit (e.g. 150KB, 200KB, 1MB)'
        required: false
        default: '150KB'
      total_js_limit:
        description: 'Total JS gzip limit (e.g. 250KB, 350KB)'
        required: false
        default: '250KB'

jobs:
  build_and_check:
    name: Build UI and Check Bundle Size
    runs-on: ubuntu-latest
    env:
      PER_FILE_LIMIT: ${{ github.event.inputs.per_file_limit || '150KB' }}
      TOTAL_JS_LIMIT: ${{ github.event.inputs.total_js_limit || '250KB' }}
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure apps/ui package-lock
        run: |
          if [ ! -f apps/ui/package-lock.json ] && [ -f apps/ui/package.json ]; then
            echo "Generating apps/ui/package-lock.json"
            npm --prefix apps/ui install --package-lock-only --silent || true
          else
            echo "apps/ui/package-lock.json already present or apps/ui missing"
          fi

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: apps/ui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('apps/ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run bundle size check
        run: npm run check-size

      - name: Upload bundle-stats and dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-bundle-stats
          path: |
            apps/ui/bundle-stats.html
            apps/ui/dist
