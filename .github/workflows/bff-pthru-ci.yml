name: bff-pthru CI

on:
  push:
    paths:
      - 'be/bff-pthru/**'
  pull_request:
    paths:
      - 'be/bff-pthru/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./be/bff-pthru
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ./be/bff-pthru
        run: npm test

  acceptance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bff-pthru docker image
        run: |
          docker build -t bff-pthru:ci ./be/bff-pthru

      - name: Start n8n stub (httpbin)
        run: |
          docker network create bffpthru-net || true
          docker run -d --name n8n-stub --network bffpthru-net postmanlabs/httpbin:latest || true

      - name: Run bff-pthru container
        run: |
          docker run -d --name bff-pthru-ci --network bffpthru-net -p 3003:3003 \
            -e N8N_WEBHOOK_URL=http://n8n-stub/post \
            bff-pthru:ci || true

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:3003/health >/dev/null 2>&1; then
              echo ok; exit 0; fi
            sleep 1
          done
          curl http://localhost:3003/health || true
          exit 1

      - name: Verify proxied POST
        run: |
          PAYLOAD='{"message":"hello","userId":"ci-test"}'
          RESP=$(curl -s -X POST http://localhost:3003/api/v1/chat -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "resp: $RESP"
          # httpbin returns echoed JSON in the `json` field
          echo "$RESP" | jq -e '.json.message == "hello"' || (echo "unexpected response" && exit 1)

      - name: Cleanup
        if: always()
        run: |
          docker rm -f bff-pthru-ci n8n-stub || true
          docker network rm bffpthru-net || true

  acceptance-compose:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bff-pthru docker image
        run: |
          docker build -t bff-pthru:ci ./be/bff-pthru

      - name: Create compose file for CI
        run: |
          cat > ci-docker-compose.yml <<'YAML'
          version: '3.8'
          services:
            n8n-stub:
              image: postmanlabs/httpbin:latest
            bff-pthru:
              image: bff-pthru:ci
              ports:
                - "3003:3003"
              environment:
                N8N_WEBHOOK_URL: "http://n8n-stub/post"
          YAML

      - name: Start stack with docker compose
        run: |
          docker compose -f ci-docker-compose.yml up -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:3003/health >/dev/null 2>&1; then
              echo ok; exit 0; fi
            sleep 1
          done
          curl http://localhost:3003/health || true
          exit 1

      - name: Verify proxied POST via compose stack
        run: |
          PAYLOAD='{"message":"hello","userId":"ci-compose"}'
          RESP=$(curl -s -X POST http://localhost:3003/api/v1/chat -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "resp: $RESP"
          echo "$RESP" | jq -e '.json.message == "hello"' || (echo "unexpected response" && exit 1)

      - name: Teardown compose stack
        if: always()
        run: |
          docker compose -f ci-docker-compose.yml down --volumes --remove-orphans || true
          docker image rm bff-pthru:ci || true
