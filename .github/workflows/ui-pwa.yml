name: UI PWA Checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  pwa-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: |
          npm ci

      - name: Build UI
        run: |
          npm run build:ci

      - name: Serve built UI in background
        run: |
          npx serve -s dist -l 4173 &
          # wait for server
          for i in {1..15}; do
            if curl --silent --fail http://localhost:4173/ >/dev/null; then
              echo "Server ready" && break
            fi
            sleep 1
          done

      - name: Lighthouse PWA check
        env:
          PWA_URL: 'http://localhost:4173'
        run: |
          npm run pwa:check

      - name: Run Playwright PWA tests
        env:
          PWA_URL: 'http://localhost:4173'
        run: |
          npx playwright install --with-deps
          npm run test:pwa
