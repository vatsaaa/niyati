name: publish-infra-images

on:
  push:
    tags:
      - 'infra-v*'

jobs:
  publish:
    name: Publish infra images to registry
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull upstream and retag/push postgres
        run: |
          docker pull postgres:15-alpine
          docker tag postgres:15-alpine ghcr.io/vatsaaa/niyati-postgres:production
          docker push ghcr.io/vatsaaa/niyati-postgres:production

      - name: Pull upstream and retag/push redis
        run: |
          docker pull redis:7-alpine
          docker tag redis:7-alpine ghcr.io/vatsaaa/niyati-redis:production
          docker push ghcr.io/vatsaaa/niyati-redis:production

      - name: Pull upstream and retag/push caddy
        run: |
          docker pull caddy:2-alpine
          docker tag caddy:2-alpine ghcr.io/vatsaaa/niyati-caddy:production
          docker push ghcr.io/vatsaaa/niyati-caddy:production

      - name: Print pushed digests
        run: |
          echo "Postgres digest:" && docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vatsaaa/niyati-postgres:production || true
          echo "Redis digest:" && docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vatsaaa/niyati-redis:production || true
          echo "Caddy digest:" && docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vatsaaa/niyati-caddy:production || true

      - name: Note about secrets
        run: |
          echo "Ensure the secret GHCR_PAT is set in repository secrets with minimal scope (packages:write)."

      - name: Save image digests to file
        run: |
          mkdir -p infra
          POSTGRES_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vatsaaa/niyati-postgres:production || true)
          REDIS_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vatsaaa/niyati-redis:production || true)
          CADDY_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vatsaaa/niyati-caddy:production || true)
          echo "postgres: ${POSTGRES_DIGEST}" > infra/IMAGE_DIGESTS.txt
          echo "redis: ${REDIS_DIGEST}" >> infra/IMAGE_DIGESTS.txt
          echo "caddy: ${CADDY_DIGEST}" >> infra/IMAGE_DIGESTS.txt
          cat infra/IMAGE_DIGESTS.txt

      - name: Create Pull Request with digests
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: infra/image-digests-${{ github.ref_name }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "chore(infra): update image digests for ${{ github.ref_name }}"
          title: "chore(infra): update image digests for ${{ github.ref_name }}"
          body: |
            This PR updates `infra/IMAGE_DIGESTS.txt` with the image digests pushed by the `publish-infra-images` workflow for tag `${{ github.ref_name }}`.
            
            Review and merge to pin digests in `infra/docker-compose.prod.yml` or `infra/INFRA_CHECKSUMS.txt` as desired.
