name: Security Vulnerability Scan

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    paths:
      - '**/package.json'
      - '**/package-lock.json'

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Audit BFF dependencies
      working-directory: ./be/bff
      run: |
        echo "=== BFF Audit Report ===" >> $GITHUB_STEP_SUMMARY
        npm audit --json > audit-bff.json || true
        npm audit >> $GITHUB_STEP_SUMMARY || true
        
    - name: Audit UI dependencies
      working-directory: ./ui
      run: |
        echo "=== UI Audit Report ===" >> $GITHUB_STEP_SUMMARY
        npm audit --json > audit-ui.json || true
        npm audit >> $GITHUB_STEP_SUMMARY || true
    
    - name: Upload audit results
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-results
        path: |
          be/bff/audit-bff.json
          ui/audit-ui.json
        retention-days: 30

  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=medium

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        deny-licenses: GPL-2.0, GPL-3.0

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
      
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  create-issue:
    name: Create Security Issue
    needs: [npm-audit, snyk-scan, trivy-scan]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'schedule'
    
    steps:
    - name: Create issue for vulnerabilities
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🔒 Security Vulnerabilities Detected - ' + new Date().toISOString().split('T')[0],
            body: 'Automated security scan has detected vulnerabilities. Please review the workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            labels: ['security', 'automated']
          })
