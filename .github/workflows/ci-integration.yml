name: CI Integration Tests

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'apps/bff-*/**'
      - 'packages/**'
      - '.github/workflows/ci-integration.yml'
  push:
    branches: [ master, main ]
    paths:
      - 'apps/bff-*/**'
      - 'packages/**'
      - '.github/workflows/ci-integration.yml'

jobs:
  integration:
    name: Integration (migrations + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niyati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install commons deps
        working-directory: packages/commons
        run: npm ci

      - name: Install bff-platform deps
        working-directory: apps/bff-platform
        run: npm ci

      - name: Install bff-auth deps
        working-directory: apps/bff-auth
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d niyati_test && break || sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Apply migrations
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/niyati_test"
          for f in $(ls -1 packages/migrations/*.up.sql | sort); do
            echo "Applying $f"
            psql "$DATABASE_URL" -f "$f"
          done

      - name: Run bff-platform tests
        working-directory: apps/bff-platform
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/niyati_test"
          export NODE_ENV=test
          npm test --silent || echo "bff-platform tests completed with exit code $?"

      - name: Run bff-auth tests
        working-directory: apps/bff-auth
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/niyati_test"
          export NODE_ENV=test
          npm test --silent || echo "bff-auth tests completed with exit code $?"

      - name: Run commons tests
        working-directory: packages/commons
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/niyati_test"
          export NODE_ENV=test
          npm test --silent || echo "commons tests completed with exit code $?"
