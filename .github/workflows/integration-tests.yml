name: BFF Integration Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  integration:
    name: Run BFF integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niyati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niyati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: be/bff-platform/package-lock.json

      - name: Install dependencies (BFF)
        working-directory: be/bff-platform
        run: |
          npm ci

      - name: Report DB health
        working-directory: be/bff-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
        run: |
          node -e 'const { Client } = require("pg");(async()=>{try{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query("SELECT current_database() as db, version() as version");console.log("DB:", r.rows[0].db);console.log("PG:", r.rows[0].version.split("\n")[0]);const t=await c.query("SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')");console.log("User tables:", t.rows[0].count);await c.end();}catch(e){console.error('DB health check failed:', e && e.message ? e.message : e);process.exit(1);} })()'

      - name: Run migrations
        working-directory: be/bff-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
        run: |
          npm run migrate:test

      - name: Run integration tests
        working-directory: be/bff-platform
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
        run: |
          npm run test:integration --silent
