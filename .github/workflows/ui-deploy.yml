name: UI Deploy (S3 + CloudFront via OIDC)

on:
  push:
    # Trigger on repository default branches (master) and main if used
    branches: [ master, main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Build (production)
        working-directory: apps/ui
        run: npm run build --if-present

      - name: Validate AWS deploy credentials
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "Using OIDC role: AWS_ROLE_ARN provided"
            exit 0
          fi
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Using AWS access keys from secrets"
            exit 0
          fi
          echo "ERROR: Missing AWS credentials. Set either 'AWS_ROLE_ARN' (for OIDC) or 'AWS_ACCESS_KEY_ID' and 'AWS_SECRET_ACCESS_KEY' in repository secrets." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # set this in repo secrets to the niyati-deployer role ARN
          aws-region: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'ap-south-1' }}

      - name: Configure AWS credentials (access keys)
        if: ${{ secrets.AWS_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'ap-south-1' }}

      - name: Precompress and upload to S3
        working-directory: apps/ui
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Fail early if the required S3 bucket secret is not configured
          if [ -z "${{ secrets.UI_S3_BUCKET }}" ]; then
            echo "ERROR: UI_S3_BUCKET secret is not set. Set the repo secret 'UI_S3_BUCKET' to your S3 bucket name." >&2
            exit 1
          fi

          chmod +x ./scripts/precompress-and-upload.sh
          ./scripts/precompress-and-upload.sh "${{ secrets.UI_S3_BUCKET }}" dist

      - name: Invalidate CloudFront (optional)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # Skip invalidation when the distribution ID secret is not set
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping CloudFront invalidation"
            exit 0
          fi

          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
