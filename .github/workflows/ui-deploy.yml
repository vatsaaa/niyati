name: UI Deploy (S3 + CloudFront via OIDC)

on:
  push:
    # Trigger on repository default branches (master) and main if used
    branches: [ master, main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Build (production)
        working-directory: apps/ui
        run: npm run build --if-present

      - name: Prepare AWS deploy env
        id: prepare-aws
        run: |
          # Set AWS_REGION with fallback
          if [ -n "${{ secrets.AWS_REGION }}" ]; then
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          else
            echo "AWS_REGION=ap-south-1" >> $GITHUB_ENV
          fi

          # Detect credentials method
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_USE_ROLE=true" >> $GITHUB_ENV
            echo "AWS_ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}" >> $GITHUB_ENV
          else
            echo "AWS_USE_ROLE=false" >> $GITHUB_ENV
          fi

          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "AWS_USE_KEYS=true" >> $GITHUB_ENV
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          else
            echo "AWS_USE_KEYS=false" >> $GITHUB_ENV
          fi

          if [ "${AWS_USE_ROLE}" != "true" ] && [ "${AWS_USE_KEYS}" != "true" ]; then
            echo "ERROR: Missing AWS credentials. Set either 'AWS_ROLE_ARN' (for OIDC) or 'AWS_ACCESS_KEY_ID' and 'AWS_SECRET_ACCESS_KEY' in repository secrets." >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_USE_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }} # set this in repo secrets to the niyati-deployer role ARN
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: env.AWS_USE_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Precompress and upload to S3
        working-directory: apps/ui
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Fail early if the required S3 bucket secret is not configured
          if [ -z "${{ secrets.UI_S3_BUCKET }}" ]; then
            echo "ERROR: UI_S3_BUCKET secret is not set. Set the repo secret 'UI_S3_BUCKET' to your S3 bucket name." >&2
            exit 1
          fi

          chmod +x ./scripts/precompress-and-upload.sh
          ./scripts/precompress-and-upload.sh "${{ secrets.UI_S3_BUCKET }}" dist

      - name: Invalidate CloudFront (optional)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # Skip invalidation when the distribution ID secret is not set
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping CloudFront invalidation"
            exit 0
          fi

          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
