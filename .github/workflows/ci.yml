name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Full Stack Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Host Dependencies (workspaces)
      run: |
        # Install all workspace packages from root lockfile to avoid per-package npm ci EUSAGE
        npm ci --workspaces --no-audit --no-fund

        # Ensure per-package lockfiles exist for Docker builds (non-fatal)
        for p in packages/commons apps/bff-platform apps/bff-auth apps/ui; do
          if [ -f "$p/package.json" ] && [ ! -f "$p/package-lock.json" ] && [ ! -f "$p/yarn.lock" ]; then
            echo "Generating package-lock.json for $p"
            npm --prefix "$p" install --package-lock-only --silent || true
          fi
        done

    - name: Run Full Integration Suite (Backend + E2E)
      env:
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        chmod +x scripts/ci-run-tests.sh
        # Ensure infra/.env.ci exists (create from workflow env if missing)
        if [ ! -f infra/.env.ci ]; then
          echo "[INFO] infra/.env.ci not found, creating from workflow env vars"
          cat > infra/.env.ci <<EOF
      # CI-generated .env.ci (created by workflow)
      BFF_PLATFORM_PORT=${{ secrets.BFF_PLATFORM_PORT || '4000' }}
      BFF_AUTH_PORT=${{ secrets.BFF_AUTH_PORT || '4001' }}
      CADDY_HTTP_PORT=${{ secrets.CADDY_HTTP_PORT || '6173' }}
      N8N_PORT=${{ secrets.N8N_PORT || '6678' }}
      BASE_URL=${{ secrets.BASE_URL || 'http://127.0.0.1:6173' }}
      POSTGRES_PORT=${{ secrets.POSTGRES_PORT || '56432' }}
      REDIS_PORT=${{ secrets.REDIS_PORT || '7379' }}
      NODE_ENV=production
      BUILD_TARGET=production
      IMAGE_TAG=ci
      SERVICE_TOKEN=${{ secrets.SERVICE_TOKEN || 'ci-test-token' }}
      POSTGRES_USER=${{ secrets.POSTGRES_USER || 'niyati' }}
      POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'niyati_ci_pass' }}
      POSTGRES_DB=${{ secrets.POSTGRES_DB || 'niyati_ci' }}
      VITE_N8N_WEBHOOK_URL=/webhook/chat
      VITE_BFF_BASE_URL=
      VITE_DEBUG_MODE=true
      CORS_ALLOWED=http://localhost:6173,http://127.0.0.1:6173
      LOG_LEVEL=info
      LOG_PRETTY_PRINT=false
      API_VERSION=v1
      ASTRO_API_URL=${{ secrets.ASTRO_API_URL || 'https://json.freeastrologyapi.com' }}
      ASTRO_API_KEY=${{ secrets.ASTRO_API_KEY || '' }}
      GEOCODE_MAPS_KEY=${{ secrets.GEOCODE_MAPS_KEY || '' }}
      GEOCODE_CACHE_TTL=86400
      EMAIL_FROM=
      SMTP_HOST=
      SMTP_PORT=
      SMTP_SECURE=
      AWS_REGION=${{ secrets.AWS_REGION || 'ap-south-1' }}
      NIYATI_DEPLOYER_RGN=${{ secrets.NIYATI_DEPLOYER_RGN || 'ap-south-1' }}
      EOF
        fi

        ./scripts/ci-run-tests.sh

    - name: Upload Playwright Traces (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: e2e/test-results/
        retention-days: 7

    - name: Upload Coverage Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifacts
        path: artifacts/coverage/**
        retention-days: 30

    - name: Upload Merged Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: merged-coverage
        path: artifacts/coverage/merged/**
        retention-days: 30
