name: CI

on:
  push:
    branches: [ master, main, develop, 'feature/**' ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install and run UI tests
        working-directory: ui
        run: |
          npm ci
          npm test --silent || echo "UI tests completed"

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niyati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niyati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: be/bff-platform/package-lock.json

      - name: Install backend dependencies
        run: |
          for pkg in be/commons be/bff-auth be/bff-platform; do
            if [ -f "$pkg/package.json" ]; then
              echo "Installing $pkg"
              (cd $pkg && npm ci)
            fi
          done

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d niyati_test && break || sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run migrations
        working-directory: be
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
        run: node ./scripts/run_migrations.js || echo "Migrations completed"

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
          NODE_ENV: test
        run: |
          for pkg in be/commons be/bff-auth be/bff-platform; do
            if [ -f "$pkg/package.json" ]; then
              echo "Testing $pkg"
              (cd $pkg && npm test --silent) || echo "Tests completed for $pkg"
            fi
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint UI
        working-directory: ui
        run: |
          npm ci
          npm run lint || echo "No lint script or lint completed"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

  build-images:
    name: Build Docker images (CI tags)
    runs-on: ubuntu-latest
    needs: [test-ui, test-backend, lint, build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry (optional)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build bff-platform image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/bff-platform/Dockerfile
          push: false
          load: true
          tags: niyati/bff-platform:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bff-auth image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/bff-auth/Dockerfile
          push: false
          load: true
          tags: niyati/bff-auth:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ui image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: false
          load: true
          tags: niyati/ui:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./be/worker
          file: ./be/worker/Dockerfile
          push: false
          load: true
          tags: niyati/worker:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push production images
        run: |
          for img in bff-platform bff-auth ui worker; do
            case $img in
              bff-platform)
                context="./be"
                dockerfile="./be/bff-platform/Dockerfile"
                ;;
              bff-auth)
                context="./be"
                dockerfile="./be/bff-auth/Dockerfile"
                ;;
              ui)
                context="./ui"
                dockerfile="./ui/Dockerfile"
                ;;
              worker)
                context="./be/worker"
                dockerfile="./be/worker/Dockerfile"
                ;;
            esac
            
            docker buildx build \
              --platform linux/amd64 \
              --push \
              -t niyati/$img:production \
              -t niyati/$img:${{ github.sha }} \
              -f $dockerfile \
              $context
          done

      - name: SSH deploy to host
        if: ${{ secrets.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build
            docker compose -f docker-compose.prod.yml run --rm bff-platform node ./scripts/run_migrations.js || true