name: CI

on:
  push:
    branches: [ master, main, develop, 'feature/**' ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install and run UI tests
        working-directory: ui
        run: |
          npm ci
          npm test --silent

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niyati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niyati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: be/bff-platform/package-lock.json

      - name: Install backend dependencies
        run: |
          for pkg in be/bff-auth be/bff-platform be/commons; do
            if [ -f "$pkg/package.json" ]; then
              echo "Installing $pkg"
              (cd $pkg && npm ci)
            fi
          done

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d niyati_test && break || sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run migrations
        working-directory: be
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
        run: node ./scripts/run_migrations.js

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
          NODE_ENV: test
        run: |
          for pkg in be/bff-auth be/bff-platform be/commons; do
            if [ -f "$pkg/package.json" ]; then
              echo "Testing $pkg"
              (cd $pkg && npm test --silent) || echo "Tests failed or not configured for $pkg"
            fi
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint UI
        working-directory: ui
        run: |
          npm ci
          npm run lint || echo "No lint script"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7
