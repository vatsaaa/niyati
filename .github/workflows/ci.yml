name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Full Stack Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Host Dependencies (workspaces)
      run: |
        # Install all workspace packages from root lockfile to avoid per-package npm ci EUSAGE
        npm ci --workspaces --no-audit --no-fund

        # Ensure per-package lockfiles exist for Docker builds (non-fatal)
        for p in packages/commons apps/bff-platform apps/bff-auth apps/ui; do
          if [ -f "$p/package.json" ] && [ ! -f "$p/package-lock.json" ] && [ ! -f "$p/yarn.lock" ]; then
            echo "Generating package-lock.json for $p"
            npm --prefix "$p" install --package-lock-only --silent || true
          fi
        done

    - name: Run Full Integration Suite (Backend + E2E)
      env:
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
      run: |
        chmod +x scripts/ci-run-tests.sh
        ./scripts/ci-run-tests.sh

    - name: Upload Playwright Traces (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: e2e/test-results/
        retention-days: 7

    - name: Upload Coverage Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifacts
        path: artifacts/coverage/**
        retention-days: 30

    - name: Upload Merged Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: merged-coverage
        path: artifacts/coverage/merged/**
        retention-days: 30
