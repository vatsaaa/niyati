name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Full Stack Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Host Dependencies (workspaces)
      run: |
        # Install all workspace packages from root lockfile to avoid per-package npm ci EUSAGE
        npm ci --workspaces --no-audit --no-fund

        # Ensure per-package lockfiles exist for Docker builds (non-fatal)
        for p in packages/commons apps/bff-platform apps/bff-auth apps/ui; do
          if [ -f "$p/package.json" ] && [ ! -f "$p/package-lock.json" ] && [ ! -f "$p/yarn.lock" ]; then
            echo "Generating package-lock.json for $p"
            npm --prefix "$p" install --package-lock-only --silent || true
          fi
        done

    - name: Run Full Integration Suite (Backend + E2E)
      env:
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        BFF_PLATFORM_PORT: ${{ secrets.BFF_PLATFORM_PORT }}
        BFF_AUTH_PORT: ${{ secrets.BFF_AUTH_PORT }}
        CADDY_HTTP_PORT: ${{ secrets.CADDY_HTTP_PORT }}
        N8N_PORT: ${{ secrets.N8N_PORT }}
        BASE_URL: ${{ secrets.BASE_URL }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        REDIS_PORT: ${{ secrets.REDIS_PORT }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ASTRO_API_URL: ${{ secrets.ASTRO_API_URL }}
        ASTRO_API_KEY: ${{ secrets.ASTRO_API_KEY }}
        GEOCODE_MAPS_KEY: ${{ secrets.GEOCODE_MAPS_KEY }}
        NIYATI_DEPLOYER_RGN: ${{ secrets.NIYATI_DEPLOYER_RGN }}
      run: |
        chmod +x scripts/ci-run-tests.sh
        # Ensure infra/.env.ci exists (create from workflow env if missing)
        if [ ! -f infra/.env.ci ]; then
          echo "[INFO] infra/.env.ci not found, generating via helper script"
          chmod +x ./scripts/generate_env_ci.sh
          ./scripts/generate_env_ci.sh
        fi

        # docker-compose expects infra/.env — copy generated .env.ci to .env if missing
        if [ ! -f infra/.env ]; then
          cp infra/.env.ci infra/.env || true
          echo "[INFO] infra/.env created from infra/.env.ci"
        fi

        ./scripts/ci-run-tests.sh

    - name: Upload Playwright Traces (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: e2e/test-results/
        retention-days: 7

    - name: Upload CI Compose Logs (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ci-compose-logs
        path: artifacts/coverage/ci-logs/**
        retention-days: 7

    - name: Upload Coverage Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifacts
        path: artifacts/coverage/**
        retention-days: 30

    - name: Upload Merged Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: merged-coverage
        path: artifacts/coverage/merged/**
        retention-days: 30
