name: CI

on:
  push:
    branches: [ master, main, '**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install and run UI tests
        working-directory: ui
        run: |
          npm ci
          npm test --silent

  test-backend:
    name: Backend packages tests
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install and run backend package tests
        run: |
          set -eux
          PACKAGES="be/bff-auth be/bff-platform be/commons"
          for pkg in $PACKAGES; do
            if [ -f "$pkg/package.json" ]; then
              echo "\n---- Testing $pkg ----\n"
              pushd $pkg >/dev/null
              npm ci
              npm test --silent
              popd >/dev/null
            else
              echo "Skipping $pkg (no package.json)"
            fi
          done
name: CI

on:
  push:
    branches: [ master, main, develop, feature/** ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  # Lint and format check
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            be/bff-platform/package-lock.json
            ui/package-lock.json

      - name: Install BFF Platform dependencies
        working-directory: ./be/bff-platform
        run: npm ci

      - name: Install BFF Auth dependencies
        working-directory: ./be/bff-auth
        run: npm ci

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Lint BFF Platform
        working-directory: ./be/bff-platform
        run: npm run lint || echo "No lint script defined"

      - name: Lint UI
        working-directory: ./ui
        run: npm run lint || echo "No lint script defined"

  # Security vulnerability scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            be/bff-platform/package-lock.json
            ui/package-lock.json

      - name: Run npm audit (BFF Platform)
        working-directory: ./be/bff-platform
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit (UI)
        working-directory: ./ui
        run: npm audit --audit-level=moderate || true

      - name: OWASP Dependency Check (BFF)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'niyati-bff'
          path: './be/bff-platform'
          format: 'HTML'
        continue-on-error: true

      - name: OWASP Dependency Check (UI)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'niyati-ui'
          path: './ui'
          format: 'HTML'
        continue-on-error: true

      - name: Upload dependency check reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: reports/
          retention-days: 7

  # Unit tests with Postgres
  platform-tests:
    name: BFF Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niyati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niyati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install BFF Platform dependencies
        working-directory: be/bff-platform
        run: npm ci

      - name: Install BFF Auth dependencies
        working-directory: be/bff-auth
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d niyati_test && break || sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run migrations (Node runner)
        working-directory: be
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
        run: node ./scripts/run_migrations.js

      - name: Run BFF Platform tests
        working-directory: be/bff-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
          NODE_ENV: test
        run: npm test

      - name: Run BFF Auth tests
        working-directory: be/bff-auth
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niyati_test
          NODE_ENV: test
        run: npm test || echo "No tests configured"

  # Build and matrix tests
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            be/bff-platform/package-lock.json
            ui/package-lock.json

      - name: Install BFF Platform dependencies
        working-directory: ./be/bff-platform
        run: npm ci

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build UI
        working-directory: ./ui
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

  # Code quality analysis
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Deployment (only on main/master branch)
  deploy:
    name: Deploy
    needs: [lint, security, platform-tests, build, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Deploy to production
        run: |
          echo "🚀 Deployment step - configure your deployment here"
          # Example: Deploy to Vercel, AWS, etc.
