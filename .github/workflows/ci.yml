name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'infra/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Full Stack Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Host Dependencies (workspaces)
      run: |
        # Install all workspace packages from root lockfile to avoid per-package npm ci EUSAGE
        npm ci --workspaces --no-audit --no-fund

        # Ensure per-package lockfiles exist for Docker builds (non-fatal)
        for p in packages/commons apps/bff-platform apps/bff-auth apps/ui; do
          if [ -f "$p/package.json" ] && [ ! -f "$p/package-lock.json" ] && [ ! -f "$p/yarn.lock" ]; then
            echo "Generating package-lock.json for $p"
            npm --prefix "$p" install --package-lock-only --silent || true
          fi
        done

    - name: Prepare CI Environment (infra/.env)
      env:
        ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        ASTRO_API_KEY: ${{ secrets.ASTRO_API_KEY }}
      run: |
        echo "::group::Prepare infra/.env for CI"
        
        # Generate base infra/.env if missing
        if [ ! -f infra/.env ]; then
          echo "[INFO] infra/.env not found, generating via helper script"
          chmod +x ./scripts/generate_env_ci.sh
          ./scripts/generate_env_ci.sh
        fi

        # Inject ACCESS_TOKEN_SECRET (required for bff-auth)
        if [ -n "${ACCESS_TOKEN_SECRET:-}" ]; then
          echo "[INFO] Using ACCESS_TOKEN_SECRET from repository secrets"
          sed -i.bak '/^ACCESS_TOKEN_SECRET=/d' infra/.env || true
          echo "ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}" >> infra/.env
        else
          echo "[WARN] ACCESS_TOKEN_SECRET not in secrets; generating temporary value for CI"
          if command -v openssl >/dev/null 2>&1; then
            ACCESS_TOKEN_SECRET_GEN=$(openssl rand -hex 32)
          else
            ACCESS_TOKEN_SECRET_GEN=$(head -c32 /dev/urandom | base64 | tr -d '\n')
          fi
          sed -i.bak '/^ACCESS_TOKEN_SECRET=/d' infra/.env || true
          echo "ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET_GEN}" >> infra/.env
        fi

        # Inject ASTRO_API_KEY (optional but recommended)
        if [ -n "${ASTRO_API_KEY:-}" ]; then
          echo "[INFO] Using ASTRO_API_KEY from repository secrets"
          sed -i.bak '/^ASTRO_API_KEY=/d' infra/.env || true
          echo "ASTRO_API_KEY=${ASTRO_API_KEY}" >> infra/.env
        fi

        # Verify critical secrets are present
        echo "[INFO] Verifying required secrets in infra/.env..."
        if grep -q '^ACCESS_TOKEN_SECRET=' infra/.env; then
          echo "✓ ACCESS_TOKEN_SECRET present"
        else
          echo "✗ ACCESS_TOKEN_SECRET missing - CI will fail"
          exit 1
        fi

        # Show masked confirmation (do NOT echo actual values)
        echo "[INFO] infra/.env prepared successfully"
        echo "::endgroup::"

    - name: Run Full Integration Suite (Backend + E2E)
      env:
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        BFF_PLATFORM_PORT: ${{ secrets.BFF_PLATFORM_PORT }}
        BFF_AUTH_PORT: ${{ secrets.BFF_AUTH_PORT }}
        CADDY_HTTP_PORT: ${{ secrets.CADDY_HTTP_PORT }}
        N8N_PORT: ${{ secrets.N8N_PORT }}
        BASE_URL: ${{ secrets.BASE_URL }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        REDIS_PORT: ${{ secrets.REDIS_PORT }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ASTRO_API_URL: ${{ secrets.ASTRO_API_URL }}
        GEOCODE_MAPS_KEY: ${{ secrets.GEOCODE_MAPS_KEY }}
        NIYATI_DEPLOYER_RGN: ${{ secrets.NIYATI_DEPLOYER_RGN }}
      run: |
        chmod +x scripts/ci-run-tests.sh
        ./scripts/ci-run-tests.sh

    - name: Upload Playwright Traces (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: e2e/test-results/
        retention-days: 7

    - name: Upload CI Compose Logs (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ci-compose-logs
        path: artifacts/coverage/ci-logs/**
        retention-days: 7

    - name: Upload Coverage Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifacts
        path: artifacts/coverage/**
        retention-days: 30

    - name: Upload Merged Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: merged-coverage
        path: artifacts/coverage/merged/**
        retention-days: 30
