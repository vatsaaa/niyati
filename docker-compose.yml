# Docker Compose for Niyati - Base Configuration
# This file contains all service definitions with sensible defaults
# Use with override files for environment-specific customization

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: niyati-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyati_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-niyati_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./be/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niyati} -d ${POSTGRES_DB:-niyati_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1GB}"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: niyati-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - niyati
    restart: unless-stopped

  # MailHog - Email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: niyati-mailhog
    ports:
      - "${MAILHOG_WEB_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - niyati
    restart: unless-stopped

  # BFF Auth Service
  bff-auth:
    build:
      context: ./be
      dockerfile: bff-auth/Dockerfile
      target: ${BUILD_TARGET:-development}
    image: niyati/bff-auth:${BUILD_TARGET:-development}
    container_name: niyati-bff-auth
    ports:
      - "${BFF_AUTH_PORT:-3001}:${BFF_AUTH_PORT:-3001}"
    env_file:
      - .env
      - .env.bff.auth
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_PRETTY_PRINT=${LOG_PRETTY_PRINT:-true}
      - PORT=${BFF_AUTH_PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${BFF_AUTH_PORT:-3001}/api/v1/telemetry/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # BFF Platform Service
  bff-platform:
    build:
      context: ./be
      dockerfile: bff-platform/Dockerfile
      target: ${BUILD_TARGET:-development}
    image: niyati/bff-platform:${BUILD_TARGET:-development}
    container_name: niyati-bff-platform
    ports:
      - "${BFF_PLATFORM_PORT:-3000}:${BFF_PLATFORM_PORT:-3000}"
    env_file:
      - .env
      - .env.bff.platform
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_PRETTY_PRINT=${LOG_PRETTY_PRINT:-true}
      - PORT=${BFF_PLATFORM_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${BFF_PLATFORM_PORT:-3000}/api/v1/telemetry/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # BFF Passthrough Service (optional)
  bff-pthru:
    build:
      context: ./be
      dockerfile: bff-pthru/Dockerfile
    image: niyati/bff-pthru:latest
    container_name: niyati-bff-pthru
    ports:
      - "${BFF_PTHRU_PORT:-3003}:${BFF_PTHRU_PORT:-3003}"
    environment:
      - PORT=${BFF_PTHRU_PORT:-3003}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_TOKEN=${N8N_TOKEN}
    networks:
      - niyati
    restart: unless-stopped
    profiles:
      - pthru

  # UI Service
  ui-service:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        - VITE_BFF_BASE_URL=${VITE_BFF_BASE_URL:-}
        - VITE_N8N_WEBHOOK_URL=${VITE_N8N_WEBHOOK_URL}
        - VITE_BFF_PTHRU_URL=${VITE_BFF_PTHRU_URL:-}
        - VITE_DEBUG_MODE=${VITE_DEBUG_MODE:-false}
    image: niyati/ui:${BUILD_TARGET:-development}
    container_name: niyati-ui
    ports:
      - "${UI_PORT:-5173}:${UI_PORT:-5173}"
    env_file:
      - .env.ui
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${UI_PORT:-5173}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - bff-platform
      - bff-auth

  # Background Worker (optional, production)
  worker:
    build:
      context: ./be/worker
      dockerfile: Dockerfile
    image: niyati/worker:latest
    container_name: niyati-worker
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - EMAIL_FROM=${EMAIL_FROM}
    networks:
      - niyati
    restart: unless-stopped
    depends_on:
      - redis
    profiles:
      - production

networks:
  niyati:
    driver: bridge
    name: niyati

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  bff-node-modules:
  ui-node-modules:
