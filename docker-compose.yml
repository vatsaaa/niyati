# Docker Compose for Niyati - Base Configuration
# This file contains all service definitions with sensible defaults
# Use with override files for environment-specific customization

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    profiles:
      - dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyati_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-niyati_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./be/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niyati} -d ${POSTGRES_DB:-niyati_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1GB}"

  # Redis Cache
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    profiles:
      - dev
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog - Email testing
  mailhog:
    image: mailhog/mailhog:latest
    expose:
      - "8025"
      - "1025"
    profiles:
      - dev
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # BFF Auth Service
  bff-auth:
    build:
      context: ./be
      dockerfile: bff-auth/Dockerfile
      target: ${BUILD_TARGET:-development}
    image: niyati/bff-auth:${IMAGE_TAG:-local}
    expose:
      - "${BFF_AUTH_PORT:-3001}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_PRETTY_PRINT=${LOG_PRETTY_PRINT:-true}
      - PORT=${BFF_AUTH_PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-http.sh http://localhost:${BFF_AUTH_PORT:-3001}/api/v1/telemetry/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # readiness is handled by the service entrypoint (wait-for-db.sh) and healthchecks

  # BFF Platform Service
  bff-platform:
    build:
      context: ./be
      dockerfile: bff-platform/Dockerfile
      target: ${BUILD_TARGET:-development}
    image: niyati/bff-platform:${IMAGE_TAG:-local}
    expose:
      - "${BFF_PLATFORM_PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_PRETTY_PRINT=${LOG_PRETTY_PRINT:-true}
      - PORT=${BFF_PLATFORM_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-http.sh http://localhost:${BFF_PLATFORM_PORT:-3000}/api/v1/telemetry/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # readiness is handled by the service entrypoint (wait-for-db.sh) and healthchecks

  # UI Service
  ui-service:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        - VITE_BFF_BASE_URL=${VITE_BFF_BASE_URL:-}
        - VITE_N8N_WEBHOOK_URL=${VITE_N8N_WEBHOOK_URL}
        - VITE_DEBUG_MODE=${VITE_DEBUG_MODE:-false}
    image: niyati/ui:${IMAGE_TAG:-local}
    expose:
      - "80"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=/api
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-http.sh http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - bff-platform
      - bff-auth

  # Caddy gateway (routes /api -> bff-platform, everything else -> ui-service)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui-service
      - bff-platform
    networks:
      - niyati

  # Background Worker (optional, production)
  worker:
    build:
      context: ./be/worker
      dockerfile: Dockerfile
    image: niyati/worker:latest
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - EMAIL_FROM=${EMAIL_FROM}
    networks:
      - niyati
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node /usr/src/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    # readiness is handled by the service entrypoint (wait-for-db.sh) and healthchecks
    profiles:
      - production

networks:
  niyati:
    driver: bridge
    # Leave `name` unset so Compose generates a stack-scoped network name
    # This avoids collisions when running multiple stacks on the same host

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  
