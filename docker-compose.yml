# Docker Compose for Niyati - Development Environment
# Usage: docker-compose up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: niyati-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyati_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-niyati_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional: init scripts
      - ./be/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niyati} -d ${POSTGRES_DB:-niyati_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # (BFF split) bff-auth and bff-platform services defined below

  # UI Service (React Frontend)
  ui-service:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: development
    container_name: niyati-ui-dev
    ports:
      - "5173:5173"
    volumes:
      # Source code for hot reload
      - ./ui:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
    env_file:
      - .env.ui
    environment:
      - NODE_ENV=development
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - bff-platform

  bff-auth:
    build:
      context: ./be
      dockerfile: bff-auth/Dockerfile
      target: development
    container_name: niyati-bff-auth-dev
    ports:
      - "3001:3001"
    # volumes:
    #   - ./be/bff-auth:/app
    #   - /app/node_modules
    env_file:
      - .env.bff.auth
    environment:
      - NODE_ENV=development
      - LOG_PRETTY_PRINT=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/telemetry/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  bff-platform:
    build:
      context: ./be
      dockerfile: bff-platform/Dockerfile
      target: development
    container_name: niyati-bff-platform-dev
    ports:
      - "3000:3000"
    # volumes:
    #   - ./be/bff-platform:/app
    #   - /app/node_modules
    env_file:
      - .env.bff.platform
    environment:
      - NODE_ENV=development
      - LOG_PRETTY_PRINT=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/telemetry/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # MailHog - development SMTP / email catcher
  mailhog:
    image: mailhog/mailhog:latest
    container_name: niyati-mailhog-dev
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP port
    networks:
      - niyati
    restart: unless-stopped

  # Redis - development cache/session store
  redis:
    image: redis:7-alpine
    container_name: niyati-redis-dev
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    networks:
      - niyati
    restart: unless-stopped

networks:
  niyati:
    driver: bridge
    name: niyati

volumes:
  # PostgreSQL data persistence
  postgres-data:
    driver: local
  # Named volumes for node_modules (if needed in future)
  bff-node-modules:
  ui-node-modules:
