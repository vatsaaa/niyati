# Docker Compose for Niyati - Base Configuration
# This file contains all service definitions with sensible defaults
# Use with override files for environment-specific customization
#
# Environment-specific overrides:
#   Development: docker compose up -d (uses docker-compose.override.yml)
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   CI:          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

# =============================================================================
# YAML ANCHORS & EXTENSIONS (DRY Configuration)
# =============================================================================

# Shared healthcheck defaults for HTTP-based services
x-healthcheck-http: &healthcheck-http
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

# Shared healthcheck for infrastructure services (faster checks)
x-healthcheck-infra: &healthcheck-infra
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

# Common Node.js service settings
x-node-service: &node-service
  restart: unless-stopped
  networks:
    - niyati

# Shared BFF build configuration
x-bff-build: &bff-build
  context: ./be
  target: ${BUILD_TARGET:-development}

# Shared BFF environment variables (reduces duplication across auth/platform)
x-bff-environment: &bff-environment
  NODE_ENV: ${NODE_ENV:-development}
  LOG_PRETTY_PRINT: ${LOG_PRETTY_PRINT:-true}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  CORS_ALLOWED: ${CORS_ALLOWED:-http://localhost:5173}
  ALLOW_CROSS_SITE_COOKIES: ${ALLOW_CROSS_SITE_COOKIES:-false}
  API_VERSION: ${API_VERSION:-v1}

# =============================================================================
# SERVICES
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyati_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-niyati_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./be/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niyati} -d ${POSTGRES_DB:-niyati_dev}"]
      <<: *healthcheck-infra
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1GB}"

  # Redis Cache
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-infra

  # MailHog - Email testing (development only)
  mailhog:
    image: mailhog/mailhog:latest
    expose:
      - "8025"
      - "1025"
    profiles:
      - dev
    networks:
      - niyati
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025 || exit 1"]
      <<: *healthcheck-infra

  # BFF Auth Service
  bff-auth:
    <<: *node-service
    build:
      <<: *bff-build
      dockerfile: bff-auth/Dockerfile
    image: niyati/bff-auth:${IMAGE_TAG:-local}
    expose:
      - "${BFF_AUTH_PORT:-3001}"
    env_file:
      - .env
    environment:
      <<: *bff-environment
      PORT: ${BFF_AUTH_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-http.sh http://localhost:${BFF_AUTH_PORT:-3001}/api/v1/telemetry/health"]
      <<: *healthcheck-http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # BFF Platform Service
  bff-platform:
    <<: *node-service
    build:
      <<: *bff-build
      dockerfile: bff-platform/Dockerfile
    image: niyati/bff-platform:${IMAGE_TAG:-local}
    expose:
      - "${BFF_PLATFORM_PORT:-3000}"
    env_file:
      - .env
    environment:
      <<: *bff-environment
      PORT: ${BFF_PLATFORM_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-niyati}:${POSTGRES_PASSWORD:-niyati_dev_pass}@postgres:5432/${POSTGRES_DB:-niyati_dev}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/chat}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-http.sh http://localhost:${BFF_PLATFORM_PORT:-3000}/api/v1/telemetry/health"]
      <<: *healthcheck-http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # UI Service - builds static assets for Caddy to serve
  ui-service:
    <<: *node-service
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL}
        VITE_DEBUG_MODE: ${VITE_DEBUG_MODE:-false}
    image: niyati/ui:${IMAGE_TAG:-local}
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: /api
    volumes:
      - ui-dist:/app/dist
    # No healthcheck needed for production (it just holds files)
    # Development target has its own healthcheck in the Dockerfile
    depends_on:
      bff-platform:
        condition: service_healthy
      bff-auth:
        condition: service_healthy

  # Caddy gateway - serves UI static files and proxies API requests
  caddy:
    image: caddy:2-alpine
    <<: *node-service
    ports:
      - "${CADDY_HTTP_PORT:-5173}:5173"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ui-dist:/srv:ro
    depends_on:
      - ui-service
      - bff-platform
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173 || exit 1"]
      <<: *healthcheck-infra

  # Background Worker (optional, production)
  worker:
    <<: *node-service
    build:
      context: ./be/worker
      dockerfile: Dockerfile
    image: niyati/worker:${IMAGE_TAG:-local}
    restart: on-failure
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      EMAIL_FROM: ${EMAIL_FROM}
    healthcheck:
      test: ["CMD-SHELL", "node /usr/src/app/healthcheck.js"]
      <<: *healthcheck-http
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - production

networks:
  niyati:
    driver: bridge
    # Leave `name` unset so Compose generates a stack-scoped network name
    # This avoids collisions when running multiple stacks on the same host

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  ui-dist:
    driver: local
  
