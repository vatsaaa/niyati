# Docker Compose - Production Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    container_name: niyati-postgres-prod
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niyati_prod}
      POSTGRES_PASSWORD: ""  # Clear base password
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-niyati_prod}
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "1GB"
      POSTGRES_EFFECTIVE_CACHE: "3GB"
    restart: always

  redis:
    container_name: niyati-redis-prod
    volumes:
      - redis-data-prod:/data
    restart: always

  bff-auth:
    build:
      target: production
    image: niyati/bff-auth:production
    container_name: niyati-bff-auth-prod
    ports: []
    expose:
      - "${BFF_AUTH_PORT:-3001}"
    secrets:
      - postgres_password
      - jwt_secret
      - smtp_user
      - smtp_password
    environment:
      - NODE_ENV=production
      - LOG_PRETTY_PRINT=false
      - LOG_LEVEL=info
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SMTP_USER_FILE=/run/secrets/smtp_user
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
    restart: always

  bff-platform:
    build:
      target: production
    image: niyati/bff-platform:production
    container_name: niyati-bff-platform-prod
    ports: []
    expose:
      - "${BFF_PLATFORM_PORT:-3000}"
    secrets:
      - postgres_password
    environment:
      - NODE_ENV=production
      - LOG_PRETTY_PRINT=false
      - LOG_LEVEL=info
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    restart: always

  ui-service:
    build:
      target: production
    image: niyati/ui:production
    container_name: niyati-ui-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    container_name: niyati-worker-prod
    secrets:
      - smtp_user
      - smtp_password
      - worker_token
    environment:
      - SMTP_USER_FILE=/run/secrets/smtp_user
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - WORKER_TOKEN_FILE=/run/secrets/worker_token
    restart: always
    profiles: []

  # Migration runner (one-shot)
  migrate:
    image: postgres:15-alpine
    container_name: niyati-migrate-prod
    restart: "no"
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-niyati_prod}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB:-niyati_prod}
      - PGHOST=postgres
      - PGPORT=5432
    networks:
      - niyati
    volumes:
      - ./be/migrations:/migrations:ro
      - ./be/scripts/run_migrations.sh:/scripts/run_migrations.sh:ro
    command: ["sh", "/scripts/run_migrations.sh"]
    profiles:
      - migration

  # Database backup worker
  db-backup:
    build:
      context: ./be/scripts/backup
      dockerfile: Dockerfile
    image: niyati/db-backup:prod
    container_name: niyati-db-backup-prod
    restart: always
    secrets:
      - postgres_password
      - aws_access_key_id
      - aws_secret_access_key
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-niyati_prod}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB:-niyati_prod}
      - BACKUP_INTERVAL=${BACKUP_INTERVAL_SECONDS:-86400}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX:-backups}
      - AWS_ACCESS_KEY_ID_FILE=/run/secrets/aws_access_key_id
      - AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/aws_secret_access_key
      - AWS_REGION=${AWS_REGION}
    networks:
      - niyati
    profiles:
      - backup

  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: niyati-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data-prod:/data
      - caddy-config-prod:/config
    networks:
      - niyati
    depends_on:
      - ui-service
      - bff-auth
      - bff-platform
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - proxy

volumes:
  postgres-data-prod:
    driver: local
  redis-data-prod:
    driver: local
  caddy-data-prod:
    driver: local
  caddy-config-prod:
    driver: local

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  smtp_user:
    file: ./secrets/smtp_user.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  aws_access_key_id:
    file: ./secrets/aws_access_key_id.txt
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key.txt
  worker_token:
    file: ./secrets/worker_token.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
